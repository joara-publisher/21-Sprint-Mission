<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  
  <!-- 파비콘 -->
  <link rel="icon" href="/img/favicon.png" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  
  <!-- Open Graph (SNS 공유용) -->
  <meta property="og:title" content="판다 마켓" />
  <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
  <meta property="og:image" content="/img/og_image.png" />
  <meta property="og:url" content="/" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="판다 마켓" />
  <meta name="twitter:description" content="일상의 모든 물건을 거래해보세요" />
  <meta name="twitter:image" content="/img/og_image.png" />

  <!-- 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo"><img src="/img/logo.png" alt="판다마켓 로고"></a>
      <a href="/signin" class="btn login_btn">로그인</a>
    </div>
  </header>
  <main>
    <section class="section section_banner">
      <div class="inner">
        <div class="content_box">
          <h2 class="section_title">일상의 모든 물건을<br />거래해 보세요</h2>
          <a href="/items" class="btn click_to_items">구경하러 가기</a>
        </div>
      </div>
    </section>
    <section class="section section_items">
      <div class="inner">
        <div class="section_img"><img src="/img/item_img.png" alt="인기 상품들 이미지"></div>
        <div class="section_txt">
          <p class="section_category">Hot item</p>
          <h2 class="section_title">인기 상품을<br />확인해 보세요</h2>
          <h3 class="section_desc">가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</h3>
        </div>
      </div>
    </section>
    <section class="section section_search">
      <div class="inner">
        <div class="section_txt">
          <p class="section_category">Search</p>
          <h2 class="section_title">구매를 원하는<br />상품을 검색하세요</h2>
          <h3 class="section_desc">구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</h3>
        </div>
        <div class="section_img"><img src="/img/search_img.png" alt="상품검색 이미지"></div>
      </div>
    </section>
    <section class="section section_register">
      <div class="inner">
        <div class="section_img"><img src="/img/register_img.png" alt="상품등록 이미지"></div>
        <div class="section_txt">
          <p class="section_category">Register</p>
          <h2 class="section_title">판매를 원하는<br />상품을 등록하세요</h2>
          <h3 class="section_desc">어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</h3>
        </div>
      </div>
    </section>
    <section class="section section_banner section_banner_02">
      <div class="inner">
        <div class="content_box">
          <h2 class="section_title">믿을 수 있는<br />판다마켓 중고 거래</h2>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="container">
      <div class="copyright">©codeit - 2024</div>
      <div class="popup_box">
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>
      <div class="link_box">
        <a href="https://www.facebook.com/" class="facebook" target="_blank"></a>
        <a href="https://x.com/" class="twitter" target="_blank"></a>
        <a href="https://www.instagram.com/" class="insta" target="_blank"></a>
        <a href="https://www.youtube.com/" class="youtube" target="_blank"></a>
      </div>
    </div>
  </footer>
</body>
</html>
